{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4 text-center">
            <h3 class="text-danger mb-3">Delete Job</h3>
            <p>Are you sure you want to delete <strong>{{ job.title }}</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Yes, Delete</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

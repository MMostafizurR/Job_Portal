{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h3 class="text-center mb-3">Post a Job Opening</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Publish Job</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'dashboard' %}">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
